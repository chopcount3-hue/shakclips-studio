<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>acting.js demo</title>
  <style>html,body{margin:0;background:#000;width:1920px;height:1080px;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<!-- core.js reads window.TIMING at load; this demo has no narration, so stub it. -->
<script>window.TIMING = { total: 12, times: [[0, 12]], sentences: ['demo'] };</script>
<script src="../../engine/core.js"></script>
<script src="../../engine/acting.js"></script>
<script>
// Demo of out/acting.js against the unmodified engine rig.
// Three beats on one timeline, every frame a pure function of t:
//   A  0.0-4.0s  anticipation -> point -> overshoot settle, with follow-through
//   B  4.0-8.0s  shock take: compress, throw back, stretch, ring down
//   C  8.0-12.0s walk cycle with contact weight, and a lip flap on fake energy
const EZ = ACT.ease, GY = 980;          // ground line for full-body figures

function panel(label, sub) {
  tag(label, 560, 96, 99, 0, { size: 42, bg: '#FFF4DC' });
  if (sub) tag(sub, 560, 178, 99, 0, { size: 30, bg: '#1d1a1a', col: '#fff' });
}
// 3-plane background: field, mid band, ground — depth without clutter
function stage(field, band) {
  bgPlain(field, shade(field, -0.18));
  ctx.fillStyle = band; ctx.fillRect(-2000, 700, 1920 + 4000, 90);
  ctx.fillStyle = shade(band, -0.22); ctx.fillRect(-2000, GY, 1920 + 4000, 400);
  line(-2000, GY, 1920 + 2000, GY, 6);
}
function marker(x) { ctx.setLineDash([18, 14]); line(x, 240, x, GY, 4, 'rgba(0,0,0,0.25)'); ctx.setLineDash([]); }

const SHOTS = [
  // ---------------------------------------------------------------- A: point
  [0, 4, (tl) => {
    stage('#F3E2C0', '#D9C49A');
    marker(1430);
    const T0 = 0.8;
    // `left: true` picks POSES.pointL, the arm that reaches toward +x — the side
    // the money is on. Pointing away from the subject is the classic rig mistake.
    const MV = { t0: T0, antic: 4 / 30, anticAmt: 0.38, dur: 5 / 30, spring: ACT.SPRING.playful };
    const poseFn = (tt) => ACT.point(tt, { t0: T0, left: true, move: MV });
    const u = ACT.moveU(tl, MV);
    const p = ACT.follow(poseFn, tl, { lag: 2 / 30, whip: 0.12, drag: 0.5 });
    // the body counters the gesture: it rocks back on the anticipation and
    // follows through after the arm, so the whole figure reads, not one limb
    p.lean = (p.lean || 0) + 0.05 * Math.min(0, u) + 0.02 * Math.max(0, u - 1);
    ACT.actor('lustig', {
      x: 700, y: GY, s: 1.35, t: tl, seed: 3, pose: p, face: 'sly',
      // the body stretches a little as the arm drives out, then settles
      squash: 0.05 * Math.max(0, u - 0.6), look: 0.9,
      eyes: { seed: 3, blinkAt: [T0 - 0.12] }   // blink on the anticipation, eyes open for the point
    });
    // the thing being pointed at arrives one beat after the arm lands
    const k = ACT.spring(tl - (T0 + 9 / 30), ACT.SPRING.playful);
    if (k > 0) withT(1430, 560, 0, k, () => { money(0, 0, 1.5, 3); });
    panel('A · ANTICIPATE → POINT → SETTLE', 'antic 4f · action 5f · spring settle, zeta 0.50');
  }],
  // ----------------------------------------------------------------- B: shock
  [4, 8, (tl) => {
    stage('#E6D2E8', '#C4A8C8');
    const T0 = 0.9;
    const p = ACT.follow((tt) => ACT.shock(tt, { t0: T0 }), tl, { lag: 3 / 30, whip: 0.16, drag: 0.55 });
    const sq = ACT.shockSquash(tl, { t0: T0, amp: 0.13 });
    ACT.actor('poisson', {
      x: 820, y: GY, s: 1.35, t: tl, seed: 11, pose: p,
      face: tl < T0 ? 'neutral' : tl < T0 + 0.12 ? 'worried' : 'shock',
      squash: sq, headSquash: sq * 0.8,
      eyes: { seed: 11, noDart: tl > T0, look: 0 }
    });
    excl(1320, 420, 2.2, tl, T0 + 4 / 30);
    panel('B · SHOCK TAKE', 'squash 2f · throw back 3f · stretch · ring down (zeta 0.28)');
  }],
  // ------------------------------------------------------------------ C: walk
  [8, 12, (tl) => {
    stage('#CFE0EA', '#A9C0D0');
    for (let i = 0; i < 5; i++) { const x = ((i * 420 - tl * 150) % 2340 + 2340) % 2340 - 210; cloud(x, 300 + (i % 2) * 70, 0.8 + (i % 3) * 0.12, '#FFFFFF'); }
    const x = lerp(260, 1560, EZ.inOutSine(Math.min(1, tl / 3.4)));
    // fake narration energy so the lip flap has something to follow
    const env = Math.max(0, Math.sin(tl * 2.1)) * (0.4 + 0.6 * Math.max(0, Math.sin(tl * 0.8)));
    ACT.actor('d2', {
      x: x, y: GY, s: 1.3, t: tl, seed: 5,
      pose: ACT.follow((tt) => ACT.walk(tt, { frames: 24 }), tl, { lag: 2 / 30, whip: 0.07, drag: 0.4, joints: ['aL', 'aR'] }),
      talk: env, shut: 'smile', eyes: { seed: 5 }
    });
    panel('C · WALK 24f CYCLE + LIP FLAP', 'contact weight on the bob · energy-gated mouth');
  }]
];

window.TOTAL_DUR = 12;
window.ready = (async () => { await document.fonts.load('900 64px "Inter Display"'); return { shots: SHOTS.length, total: 12 }; })();
window.renderFrame = function (t) {
  let i = SHOTS.length - 1; while (i > 0 && SHOTS[i][0] > t) i--;
  const sh = SHOTS[i], tl = t - sh[0];
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, 1920, 1080);
  ctx.save(); sh[2](tl, sh[1] - sh[0], t); ctx.restore();
  return { shot: i, tl: Number(tl.toFixed(3)) };
};
</script>
</body>
</html>
