<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;font-family:'Inter Display','Inter',sans-serif}
.t{position:relative;width:1280px;height:720px;overflow:hidden;background:#0c120e}
.p{position:absolute;top:0;width:640px;height:720px;background-repeat:no-repeat}
.p1{left:0;background-image:url(r0_0.58.png);background-size:1150px auto;background-position:-312px -531px}
.p2{left:640px;background-image:url(r5_12.6.png);background-size:1300px auto;background-position:-346px -806px}
.div{position:absolute;left:632px;top:0;width:16px;height:720px;background:#fff;box-shadow:0 0 30px rgba(0,0,0,.8)}
.top{position:absolute;left:0;top:18px;width:1280px;text-align:center;font-weight:900;font-size:128px;line-height:1;letter-spacing:-3px;color:#FFD24A;
  -webkit-text-stroke:10px #06210f;paint-order:stroke fill;text-shadow:0 8px 30px rgba(0,0,0,.8)}
.vs{position:absolute;left:0;top:150px;width:1280px;text-align:center}
.vs span{display:inline-block;background:#E8343A;color:#fff;font-weight:900;font-size:74px;letter-spacing:1px;padding:6px 28px;border-radius:14px;transform:rotate(-2deg);box-shadow:0 8px 24px rgba(0,0,0,.6)}
.lab{position:absolute;bottom:26px;font-weight:900;font-size:56px;color:#fff;-webkit-text-stroke:8px #000;paint-order:stroke fill}
.l1{left:40px}.l2{right:40px;color:#FFD24A}
.badge{position:absolute;right:28px;top:300px;width:200px;height:200px;border-radius:100px;background:#FFD24A;color:#1b1400;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:900;transform:rotate(8deg);box-shadow:0 10px 30px rgba(0,0,0,.6);border:6px solid #fff}
.badge b{font-size:58px;letter-spacing:-2px;line-height:1}.badge i{font-style:normal;font-size:26px;margin-top:4px}
/* vertical cover */
.v{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0c120e}
.vp1{position:absolute;left:0;top:0;width:1080px;height:960px;background:url(r0_0.58.png) no-repeat;background-size:1550px auto;background-position:-311px -709px}
.vp2{position:absolute;left:0;top:960px;width:1080px;height:960px;background:url(r5_12.6.png) no-repeat;background-size:1750px auto;background-position:-356px -1234px}
.vdiv{position:absolute;left:0;top:952px;width:1080px;height:16px;background:#fff}
.vtop{position:absolute;left:0;top:70px;width:1080px;text-align:center;font-weight:900;font-size:150px;line-height:1;letter-spacing:-4px;color:#FFD24A;-webkit-text-stroke:12px #06210f;paint-order:stroke fill;text-shadow:0 8px 30px rgba(0,0,0,.8)}
.vvs{position:absolute;left:0;top:240px;width:1080px;text-align:center}
.vvs span{display:inline-block;background:#E8343A;color:#fff;font-weight:900;font-size:92px;padding:8px 34px;border-radius:18px;transform:rotate(-2deg)}
.vbadge{position:absolute;right:48px;top:600px;width:270px;height:270px;border-radius:135px;background:#FFD24A;color:#1b1400;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:900;transform:rotate(8deg);box-shadow:0 10px 30px rgba(0,0,0,.6);border:8px solid #fff}
.vbadge b{font-size:62px;letter-spacing:-2px;line-height:1}.vbadge i{font-style:normal;font-size:32px;margin-top:6px}
.vl1{position:absolute;left:0;top:830px;width:1080px;text-align:center;font-weight:900;font-size:80px;color:#fff;-webkit-text-stroke:10px #000;paint-order:stroke fill}
.vl2{position:absolute;left:0;bottom:120px;width:1080px;text-align:center;font-weight:900;font-size:80px;color:#FFD24A;-webkit-text-stroke:10px #000;paint-order:stroke fill}
.grad{background:linear-gradient(100deg,#FFE88A,#FFD24A 38%,#F7B733 72%,#E8A317);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:0;text-shadow:none}
</style></head><body>
<div class="t" id="yt">
  <div class="p p1"></div><div class="p p2"></div><div class="div"></div>
  <div class="top" style="color:#101010;-webkit-text-stroke:16px #101010;paint-order:stroke fill;text-shadow:0 10px 26px rgba(0,0,0,.6)">ONE BANANA</div>
  <div class="top grad">ONE BANANA</div>
  <div class="vs"><span>vs 1,000 CUTS</span></div>
  <div class="lab l1">0 CUTS</div><div class="lab l2">1,000 CUTS</div>
  <div class="badge"><b style="font-size:40px">0.000018</b><i>CAL EACH?!</i></div>
</div>
<div class="v" id="cover">
  <div class="vp1"></div><div class="vp2"></div><div class="vdiv"></div>
  <div class="vtop" style="color:#101010;-webkit-text-stroke:16px #101010;paint-order:stroke fill;text-shadow:0 10px 26px rgba(0,0,0,.6)">ONE BANANA</div>
  <div class="vtop grad">ONE BANANA</div>
  <div class="vvs"><span>vs 1,000 CUTS</span></div>
  <div class="vbadge"><b style="font-size:46px">0.000018</b><i>CAL EACH?!</i></div>
  <div class="vl1">105 CALORIES</div><div class="vl2">5,855,356 PIECES</div>
</div>
</body></html>
