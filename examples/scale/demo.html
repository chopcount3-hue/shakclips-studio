<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>scale.js demo</title>
  <style>html,body{margin:0;background:#000;width:1920px;height:1080px;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<!-- core.js reads window.TIMING at load; this demo has no narration, so stub it. -->
<script>window.TIMING = { total: 22, times: [[0, 22]], sentences: ['demo'] };</script>
<script src="../../engine/core.js"></script>
<script src="../../engine/acting.js"></script>
<script src="../../engine/cosmic.js"></script>
<script src="../../engine/scale.js"></script>
<script>
// Demo of out/scale.js against the unmodified engine. Three beats, one
// timeline, every frame a pure function of t:
//   A   0-12 s   the ladder: human -> Sun, 11 rungs, continuous log zoom
//   B  12-17 s   side-by-side at one shared scale
//   C  17-22 s   a counter that lands on a number, and bars that grow
// 11 rungs, each one at least 2.5x the last and never even: 6.7, 2.9, 2.8,
// 3.5, 2.5, 10.7, 393, 3.7, 11.2, 9.7. The 393x jump (Everest to the Moon) is
// the surprise, so it gets nearly twice the screen time of a small rung.
const LADDER = ['human', 'bus', 'blueWhale', 'liberty', 'eiffel', 'burj',
                'everest', 'moon', 'earth', 'jupiter', 'sun'];
const BEATS  = [ 0.85,    0.85,  0.85,        0.9,       0.9,     0.95,
                 2.05,      1.15,   1.15,      1.15,      1.20];   // = 12.00 s

const SHOTS = [
  // ------------------------------------------------------- A: the zoom ladder
  [0, 12, (tl) => {
    // `hold` keeps 30% of each beat still so the eye can land on the rung,
    // then the camera zooms out on ease.inOutCubic for the rest of it.
    SCALE.ladder(tl, LADDER, {
      t0: 0, beats: BEATS, hold: 0.30, frac: 0.62, groundY: 960,
      title: 'SMALLEST TO LARGEST', t: tl
    });
  }],
  // ------------------------------------------------------- B: side by side
  [12, 17, (tl) => {
    SCALE.sideBySide(tl, ['liberty', 'saturnV', 'starship', 'eiffel'], {
      t0: 0.15, each: 0.12, frac: 0.74, baseY: 884, gap: 0.03,
      spring: 'premium', title: 'SAME SCALE, NO TRICKS',
      ratio: ['liberty', 'eiffel'], ratioAt: 2.0, t: tl
    });
  }],
  // ------------------------------------------------------- C: counter + bars
  [17, 22, (tl) => {
    const g = ctx.createLinearGradient(0, 0, 0, 1080);
    g.addColorStop(0, '#20314f'); g.addColorStop(1, '#0d1426');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 1920, 1080);
    // the Sun at the right so the frame has a subject, not just type
    SCALE.draw('sun', SCALE.fit(1391400000, 0.40, 'h'), { x: 1420, y: 480, t: tl });
    // the Sun's diameter in km, ticking up and landing at 1.8 s
    SCALE.counter(tl, {
      to: 1391400, t0: 0.15, dur: 1.65, ease: 'outQuint',
      x: 700, y: 212, size: 140, unit: 'km',
      label: 'THE SUN IS', note: 'across — that is 109 Earths side by side'
    });
    // how many of each you would need to cross the Sun. Log scale: the span is
    // five decades, and on a linear axis the first four bars would be invisible.
    // Every value is the verified size divided into 1,391,400 km.
    SCALE.bars(tl, [
      { label: 'Everest',      value: 157240,   col: '#8FB3C8' },
      { label: 'Burj Khalifa', value: 1680435,  col: '#C9D4DE' },
      { label: 'Eiffel Tower', value: 4216364,  col: '#E0A070' },
      { label: 'Blue whales',  value: 41534328, col: '#5C85AE' },
      { label: 'People',       value: 813684211, col: '#FFD24A' }
    ], {
      x: 400, y: 532, w: 1130, h: 66, gap: 26, t0: 1.0, each: 0.11, dur: 0.85,
      log: true, title: 'TO SPAN THE SUN YOU NEED', titleX: 64
    });
    // the payoff lands last, so the final two seconds are not a frozen frame
    SCALE.badge('813 MILLION PEOPLE, SHOULDER TO SHOULDER', 960, 1020,
      ACT.ease.outCubic((tl - 2.9) / 0.4), 0.88 + 0.12 * Math.min(1, ACT.spring(tl - 2.9, ACT.SPRING.playful)));
  }]
];

window.TOTAL_DUR = 22;
window.ready = (async () => { await document.fonts.load('900 64px "Inter Display"'); return { shots: SHOTS.length, total: 22 }; })();
window.renderFrame = function (t) {
  let i = SHOTS.length - 1; while (i > 0 && SHOTS[i][0] > t) i--;
  const sh = SHOTS[i], tl = t - sh[0];
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, 1920, 1080);
  ctx.save(); sh[2](tl, sh[1] - sh[0], t); ctx.restore();
  return { shot: i, tl: Number(tl.toFixed(3)) };
};
</script>
</body>
</html>
