<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>

const W = 1920, H = 1080, cv = document.getElementById('c'), X = cv.getContext('2d');
const INK = '#14100f';

// sticker outline: draw layer silhouette in a colour, dilated by r, then the layer
function sticker(c, r, col, shadow = true) {
  const [s, sx] = layer(); sx.drawImage(c, 0, 0); sx.globalCompositeOperation = 'source-in'; sx.fillStyle = col; sx.fillRect(0, 0, W, H);

function P(ctx, pts) { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); }

// ---------------------------------------------------------------- background
function background() {

// ---------------------------------------------------------------- the tower (golden, lit, shaded)

function star(ctx, x, y, r, col) { ctx.save(); ctx.translate(x, y); ctx.beginPath(); for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2, rr = i % 2 ? r * 0.18 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fillStyle = col; ctx.shadowColor = '#fff'; ctx.shadowBlur = 30; ctx.fill(); ctx.restore(); }
// ---------------------------------------------------------------- money

  ctx.beginPath(); ctx.moveTo(hx + 72, ey - 36); ctx.lineTo(hx + 96, ey - 52); ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 8; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(hx + 150, ey + 48); ctx.quadraticCurveTo(hx + 230, ey + 220, hx + 170, ey + 330); ctx.strokeStyle = '#d9a92c'; ctx.lineWidth = 7; ctx.stroke();

  ctx.beginPath(); ctx.moveTo(hx - 120, my - 20); ctx.quadraticCurveTo(hx, my + 110, hx + 140, my - 45); ctx.quadraticCurveTo(hx + 10, my + 20, hx - 120, my - 20); fs(ctx, '#6e1b1e', 9);
  ctx.save(); ctx.clip(); ctx.fillStyle = '#fff'; ctx.fillRect(hx - 130, my - 60, 290, 52); ctx.strokeStyle = '#c9c0b8'; ctx.lineWidth = 3; for (let i = -3; i <= 4; i++) { ctx.beginPath(); ctx.moveTo(hx + i * 32, my - 50); ctx.lineTo(hx + i * 32, my - 6); ctx.stroke(); } ctx.restore();

// ---------------------------------------------------------------- the victim (shocked)

  P(ctx, [[1400, 1100], [1450, 990], [1880, 990], [1930, 1100]]); fs(ctx, lg(ctx, 1430, 0, 1950, 0, [[0, '#a8744a'], [1, '#6b4426']]), 10);

// ---------------------------------------------------------------- SOLD tag + headline
function soldTag() {

function headline(str, x, y, size, rot) {

  for (const sx of [-1, 1]) {
